[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dundercode-engineering-system"
version = "0.1.0a1"
description = "DunderCode Engineering System knowledge platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.3",
]

[project.urls]
Homepage = "https://github.com/DunderCode-Solutions/dundercode-engineering-system"
Repository = "https://github.com/DunderCode-Solutions/dundercode-engineering-system.git"
Issues = "https://github.com/DunderCode-Solutions/dundercode-engineering-system/issues"

[project.scripts]
desys-build-index = "tools.build_index:main"
desys-check-indexes = "tools.check_generated_artifacts:main"
desys-corpus-inventory = "tools.build_corpus_inventory:main"
desys-metadata-migrate = "tools.migrate_metadata:main"
desys-metadata-validate = "tools.validate_metadata:main"
desys-project-init = "tools.init_project:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
    "setuptools==80.9.0",
    "wheel==0.45.1",
]

[tool.setuptools]
packages = [
    "tools",
    "tools.desys_indexer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
